<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10231b">
    <meta name="description" content="Bon-on의 작은 게임들을 한곳에서 플레이하고 순위를 확인하세요.">
    <title>Bon-on Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="sky-glow" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Bon-on Games 홈">
        <span class="brand-mark">B</span>
        <span>bon-on games</span>
      </a>
      <button class="quiet-button" id="open-global-ranking" type="button">전체 랭킹</button>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">SIX SMALL WORLDS · ONE PLAYGROUND</p>
        <h1 id="hero-title">잠깐의 틈을<br><em>플레이</em>로 채워요.</h1>
        <p class="hero-copy">설치 없이 바로 시작하는 Bon-on의 미니 게임 컬렉션. 기록을 남기고 오늘의 순위도 확인해 보세요.</p>
        <a class="primary-button" href="#games">게임 고르기 <span aria-hidden="true">↓</span></a>
      </section>

      <section class="games-section" id="games" aria-labelledby="games-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">THE COLLECTION</p>
            <h2 id="games-title">오늘은 뭘 해볼까요?</h2>
          </div>
          <p><span id="game-count">0</span>개의 게임</p>
        </div>
        <div class="game-grid" id="game-grid"></div>
      </section>
    </main>

    <footer>
      <span>Made for tiny breaks.</span>
      <a href="https://github.com/orgs/bon-on/repositories">GitHub</a>
    </footer>

    <dialog class="ranking-dialog" id="ranking-dialog" aria-labelledby="ranking-title">
      <div class="dialog-shell">
        <header class="dialog-header">
          <div>
            <p class="eyebrow" id="ranking-kicker">LEADERBOARD</p>
            <h2 id="ranking-title">게임 랭킹</h2>
          </div>
          <button class="icon-button" id="close-ranking" type="button" aria-label="랭킹 닫기">×</button>
        </header>

        <nav class="ranking-tabs" id="ranking-tabs" aria-label="게임 선택"></nav>
        <div class="ranking-state" id="ranking-state" role="status"></div>
        <ol class="ranking-list" id="ranking-list"></ol>

        <form class="score-form" id="score-form">
          <h3>기록 등록</h3>
          <p>게임에서 얻은 점수를 간단히 남겨보세요.</p>
          <div class="form-row">
            <label>이름<input id="player-name" name="name" maxlength="20" autocomplete="nickname" required></label>
            <label>점수<input id="player-score" name="score" type="number" min="0" max="2147483647" step="1" inputmode="numeric" required></label>
            <button class="primary-button" type="submit">등록</button>
          </div>
          <p class="form-message" id="form-message" aria-live="polite"></p>
        </form>
      </div>
    </dialog>

    <script src="config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>

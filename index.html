<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10231b">
    <meta name="description" content="Bon-on의 작은 게임들을 한곳에서 플레이하고 순위를 확인하세요.">
    <title>Bon-on Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20261106-1">
  </head>
  <body>
    <div class="sky-glow" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Bon-on Games 홈">
        <span class="brand-mark">B</span>
        <span>bon-on games</span>
      </a>
      <button class="quiet-button" id="open-global-ranking" type="button">전체 랭킹</button>
    </header>

    <main id="top">
      <section class="games-section" id="games" aria-label="게임 선택">
        <div class="game-grid" id="game-grid"></div>
      </section>
    </main>

    <footer>
      <span>Bon-on Games</span>
      <a href="https://github.com/orgs/bon-on/repositories">GitHub</a>
    </footer>

    <dialog class="ranking-dialog" id="ranking-dialog" aria-labelledby="ranking-title">
      <div class="dialog-shell">
        <header class="dialog-header">
          <div>
            <p class="eyebrow" id="ranking-kicker">LEADERBOARD</p>
            <h2 id="ranking-title">게임 랭킹</h2>
          </div>
          <button class="icon-button" id="close-ranking" type="button" aria-label="랭킹 닫기">×</button>
        </header>

        <nav class="ranking-tabs" id="ranking-tabs" aria-label="게임 선택"></nav>
        <div class="ranking-state" id="ranking-state" role="status"></div>
        <ol class="ranking-list" id="ranking-list"></ol>

        <p class="ranking-note">기록은 게임 종료 후 등록에 동의하면 자동으로 측정됩니다.</p>
      </div>
    </dialog>

    <script src="config.js?v=20261106-1"></script>
    <script type="module" src="app.js?v=20261106-1"></script>
  </body>
</html>
